<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تثبيت تطبيق فريق الملوك - iPhone</title>
<style>
  body { background: #0B1120; color: #F8FAFC; font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .card { background: #1E293B; border: 2px solid #D97706; border-radius: 20px; padding: 28px; max-width: 360px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  h1 { color: #FBBF24; font-size: 22px; margin-bottom: 8px; }
  p { color: #CBD5E1; font-size: 14px; line-height: 1.6; }
  .btn { display: block; background: linear-gradient(135deg, #D97706, #B45309); color: #fff; text-decoration: none; font-weight: bold; font-size: 17px; padding: 14px; border-radius: 14px; margin: 20px 0; }
  .qr { background: #fff; padding: 12px; border-radius: 14px; display: inline-block; margin-top: 10px; }
</style>
</head>
<body>
  <div class="card">
    <h1>🏆 فريق الملوك لكرة القدم 🏆</h1>
    <p>النسخة الرسمية لهواتف iPhone (الإصدار 2.4.0)</p>
    <a class="btn" id="otaLink" href="#">📲 تثبيت التطبيق مباشرة على الآيفون</a>
    <div class="qr"><img id="qrImg" alt="QR Code" width="170" height="170"></div>
    <p style="font-size:12px;color:#94A3B8;margin-top:12px;">امسح الرمز بكاميرا الآيفون أو اضغط زر التثبيت أعلاه</p>
  </div>
  <script>
    const base = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
    const manifestUrl = encodeURIComponent(base + '/manifest.plist');
    document.getElementById('otaLink').href = 'itms-services://?action=download-manifest&url=' + manifestUrl;
    document.getElementById('qrImg').src = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + encodeURIComponent(window.location.href);
  </script>
</body>
</html>
