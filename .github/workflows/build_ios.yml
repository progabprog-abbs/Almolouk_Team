name: Build Almolouk iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Flutter SDK 3.47.9
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.9'

      - name: Install Flet & Dependencies
        run: |
          flutter --version
          python -m pip install --upgrade pip
          pip install flet==1.1.2 flet-audio flet-audio-recorder flet-notifications requests

      - name: Build Unsigned iOS App & Package IPA
        run: |
          yes | flet build ipa --project "Almolouk_Team" --product "فريق الملوك" --org "com.almolouk.team" --build-version "2.4.1" --yes -- --no-codesign || true
          FLUTTER_DIR=$(find build -maxdepth 3 -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "Found Flutter project at: $FLUTTER_DIR"
          cd "$FLUTTER_DIR"
          flutter build ios --release --no-codesign
          APP_BUNDLE=$(find build/ios/iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "Packaging app bundle: $APP_BUNDLE"
          mkdir -p "$GITHUB_WORKSPACE/build/ipa/Payload"
          cp -R "$APP_BUNDLE" "$GITHUB_WORKSPACE/build/ipa/Payload/"
          cd "$GITHUB_WORKSPACE/build/ipa"
          zip -r Almolouk_Team.ipa Payload
          ls -lh "$GITHUB_WORKSPACE/build/ipa/Almolouk_Team.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Almolouk_Team_iOS_IPA
          path: build/ipa/Almolouk_Team.ipa